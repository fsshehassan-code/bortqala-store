<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة برتقالة</title><link rel="stylesheet" href="style.css"><style>body{padding:30px}.admin{max-width:1100px;margin:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,table{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 20px #0001}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #eee;text-align:right}button{padding:9px 14px;border:0;border-radius:9px;cursor:pointer}</style></head><body><main class="admin"><h1>لوحة إدارة برتقالة 🍊</h1><button onclick="login()">تسجيل دخول المدير</button><div id="stats" class="cards"></div><h2>المنتجات</h2><form id="productForm" onsubmit="addProduct(event)" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0"><input id="pn" placeholder="اسم المنتج" required><input id="pp" type="number" step="0.01" placeholder="السعر" required><input id="ps" type="number" placeholder="المخزون" required><input id="pi" placeholder="الأيقونة" value="🛍️"><button>إضافة</button></form><table><thead><tr><th>المنتج</th><th>السعر</th><th>المخزون</th><th>الحالة</th><th></th></tr></thead><tbody id="productsAdmin"></tbody></table><h2>الطلبات</h2><table><thead><tr><th>رقم</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th>الدفع</th></tr></thead><tbody id="orders"></tbody></table></main><script>
let t=localStorage.getItem('orangeToken')||'';const H=()=>({'Content-Type':'application/json',Authorization:'Bearer '+t});
async function login(){const email=prompt('البريد','admin@orange.local'),password=prompt('كلمة المرور');const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)return alert('بيانات غير صحيحة');t=d.token;localStorage.setItem('orangeToken',t);load()}
async function load(){const s=await fetch('/api/admin/stats',{headers:H()});if(!s.ok)return;const d=await s.json();stats.innerHTML=`<div class=card>الطلبات: <b>${d.orders}</b></div><div class=card>العملاء: <b>${d.users}</b></div><div class=card>المنتجات: <b>${d.products}</b></div>`;const pr=await fetch('/api/products');const ps=await pr.json();productsAdmin.innerHTML=ps.map(x=>`<tr><td>${x.icon||'🛍️'} ${x.name}</td><td>${Number(x.price).toLocaleString('ar-EG')} ${x.currency}</td><td>${x.stock}</td><td>${x.active?'نشط':'موقوف'}</td><td><button onclick="disableProduct('${x.id}')">إيقاف</button></td></tr>`).join('');const r=await fetch('/api/admin/orders',{headers:H()});const o=await r.json();orders.innerHTML=o.map(x=>`<tr><td>${x.number}</td><td>${x.user?.name||'-'}<br>${x.user?.email||''}</td><td>${Number(x.total).toLocaleString('ar-EG')} ${x.currency}</td><td><select onchange="status('${x.id}',this.value)"><option ${x.status==='PENDING'?'selected':''}>PENDING</option><option ${x.status==='PAID'?'selected':''}>PAID</option><option ${x.status==='PROCESSING'?'selected':''}>PROCESSING</option><option ${x.status==='SHIPPED'?'selected':''}>SHIPPED</option><option ${x.status==='DELIVERED'?'selected':''}>DELIVERED</option><option ${x.status==='CANCELLED'?'selected':''}>CANCELLED</option></select></td><td>${x.paymentStatus}</td></tr>`).join('')}
async function addProduct(e){e.preventDefault();const r=await fetch('/api/products',{method:'POST',headers:H(),body:JSON.stringify({name:pn.value,slug:pn.value.toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,'-')+'-'+Date.now(),price:Number(pp.value),stock:Number(ps.value),icon:pi.value})});if(!r.ok)return alert('تعذر إضافة المنتج');e.target.reset();load()}
async function disableProduct(id){if(!confirm('إيقاف المنتج؟'))return;await fetch('/api/products/'+id,{method:'DELETE',headers:H()});load()}
async function status(id,value){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:H(),body:JSON.stringify({status:value})});load()}load();
</script></body></html>
