services:
  - type: web
    name: bortqala-store
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIPPING_PROVIDER
        value: mock
      - key: SHIPPING_API_URL
        sync: false
      - key: SHIPPING_API_KEY
        sync: false
